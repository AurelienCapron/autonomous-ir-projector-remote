<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 480" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0d9488"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1020" height="480" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="510" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a" letter-spacing="0.5">ARCHITECTURE DU SYSTÈME D'EXTINCTION AUTOMATIQUE DES VIDÉOPROJECTEURS (PROJET 32)</text>

  <rect x="25" y="55" width="290" height="395" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="25" y="55" width="290" height="34" rx="10" fill="#0284c7"/>
  <rect x="25" y="79" width="290" height="10" fill="#0284c7"/>
  <text x="170" y="77" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" letter-spacing="0.5">ACQUISITION ÉTAT &amp; OCCUPATION SALLE</text>

  <rect x="42" y="104" width="256" height="72" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="54" y="125" font-size="12.5" font-weight="700" fill="#0369a1">État Vidéoprojecteurs (VGA &amp; LDR)</text>
  <text x="54" y="144" font-size="11" fill="#475569">• J_VGA1 (GPIO3) &amp; J_VGA2 (GPIO2)</text>
  <text x="54" y="162" font-size="11" fill="#475569">• Photorésistances PGM1201 (ADC26 / ADC27)</text>

  <rect x="42" y="190" width="256" height="72" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="54" y="211" font-size="12.5" font-weight="700" fill="#0369a1">Détection de Présence &amp; Mouvement</text>
  <text x="54" y="230" font-size="11" fill="#475569">• Capteur PIR SBC-PIR (GPIO16 - SIG)</text>
  <text x="54" y="248" font-size="11" fill="#475569">• Radar mmWave SEN0609 (GPIO17 - VOUT)</text>

  <rect x="42" y="276" width="256" height="72" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="54" y="297" font-size="12.5" font-weight="700" fill="#0369a1">Détection Acoustique (SEN-14262)</text>
  <text x="54" y="316" font-size="11" fill="#475569">• Enveloppe sonore (GPIO20 - ENVELOPE)</text>
  <text x="54" y="334" font-size="11" fill="#475569">• Seuil de déclenchement (GPIO21 - GATE)</text>

  <rect x="42" y="362" width="256" height="72" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="54" y="383" font-size="12.5" font-weight="700" fill="#0369a1">Mode Sniffer IR &amp; Calibration</text>
  <text x="54" y="402" font-size="11" fill="#475569">• Récepteur IR GT1089 (GPIO18 - S_OUT)</text>
  <text x="54" y="420" font-size="11" fill="#475569">• Bouton 3s (GPIO19) &amp; Potentiomètre (ADC28)</text>

  <rect x="375" y="55" width="275" height="395" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="375" y="55" width="275" height="34" rx="10" fill="#0f766e"/>
  <rect x="375" y="79" width="275" height="10" fill="#0f766e"/>
  <text x="512.5" y="77" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" letter-spacing="0.5">CARTE PCB KI-CAD v1.2 &amp; MICROPYTHON</text>

  <rect x="393" y="104" width="239" height="68" rx="6" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="512.5" y="125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#115e59">Étage d'Alimentation Régulée</text>
  <text x="512.5" y="144" text-anchor="middle" font-size="11" fill="#334155">Jack DC 12V (J1) → LDO TLV1117-50 (5V)</text>
  <text x="512.5" y="160" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0d9488">Rails VCC (5V) &amp; 3V3 + Filtrage CMS 10 µF</text>

  <rect x="393" y="188" width="239" height="246" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
  <text x="512.5" y="213" text-anchor="middle" font-size="14" font-weight="700" fill="#115e59">Raspberry Pi Pico 2WH</text>
  <text x="512.5" y="231" text-anchor="middle" font-size="11" font-weight="600" fill="#0d9488">Logique Embarquée (MicroPython &amp; C++)</text>
  <line x1="410" y1="243" x2="615" y2="243" stroke="#cbd5e1" stroke-width="1"/>

  <text x="405" y="266" font-size="11" font-weight="600" fill="#0f172a">1. Surveillance multi-capteurs :</text>
  <text x="415" y="283" font-size="10.5" fill="#334155">État VGA + Fusion PIR / mmWave / Son</text>

  <text x="405" y="308" font-size="11" font-weight="600" fill="#0f172a">2. Déclenchement d'extinction :</text>
  <text x="415" y="325" font-size="10.5" fill="#334155">• Inactivité &gt; 5400 s (1h30) ou Surchauffe LDR</text>
  <text x="415" y="342" font-size="10.5" fill="#334155">• Apprentissage Sniffer IR (appui 3s GPIO19)</text>

  <text x="405" y="367" font-size="11" font-weight="600" fill="#0f172a">3. Synthèse Trame NEC (0x6F905583) :</text>
  <text x="415" y="384" font-size="10.5" fill="#334155">• Header : mark(9000) + space(4500)</text>
  <text x="415" y="401" font-size="10.5" fill="#334155">• 4 octets [0x83, 0x55, 0x90, 0x6F] @ 38 kHz</text>
  <text x="415" y="418" font-size="10.5" font-weight="600" fill="#0f766e">• Salve de 3 tirs successifs (pause 500 ms)</text>

  <rect x="710" y="55" width="285" height="395" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="710" y="55" width="285" height="34" rx="10" fill="#b45309"/>
  <rect x="710" y="79" width="285" height="10" fill="#b45309"/>
  <text x="852.5" y="77" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" letter-spacing="0.5">ÉMISSION INFRAROUGE &amp; SIGNALISATION</text>

  <rect x="728" y="115" width="249" height="85" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
  <text x="852.5" y="139" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">Émetteur IR 1 — Module GT1087</text>
  <text x="852.5" y="159" text-anchor="middle" font-size="11" fill="#475569">PWM 38 kHz sur GPIO7 + R3 (220 Ω)</text>
  <text x="852.5" y="179" text-anchor="middle" font-size="11" font-weight="600" fill="#b45309">→ Extinction Vidéoprojecteur 1</text>

  <rect x="728" y="220" width="249" height="85" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
  <text x="852.5" y="244" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">Émetteur IR 2 — Module GT1087</text>
  <text x="852.5" y="264" text-anchor="middle" font-size="11" fill="#475569">PWM 38 kHz sur GPIO14 + R4 (220 Ω)</text>
  <text x="852.5" y="284" text-anchor="middle" font-size="11" font-weight="600" fill="#b45309">→ Extinction Vidéoprojecteur 2</text>

  <rect x="728" y="325" width="249" height="95" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="852.5" y="349" text-anchor="middle" font-size="12.5" font-weight="700" fill="#78350f">Signalisation &amp; Boîtier Découpe Laser</text>
  <text x="852.5" y="369" text-anchor="middle" font-size="11" fill="#92400e">• LED Présence (GPIO0) &amp; LED État (GPIO1)</text>
  <text x="852.5" y="387" text-anchor="middle" font-size="11" fill="#92400e">• Retour visuel du mode Sniffer IR</text>
  <text x="852.5" y="405" text-anchor="middle" font-size="10.5" font-weight="600" fill="#78350f">• Boîtier bois (14 × 15,5 × 10 cm) FabLab</text>

  <line x1="298" y1="140" x2="386" y2="140" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="298" y1="226" x2="386" y2="226" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="298" y1="312" x2="386" y2="312" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="298" y1="398" x2="386" y2="398" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <line x1="632" y1="250" x2="721" y2="158" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <line x1="632" y1="295" x2="721" y2="262" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <line x1="632" y1="365" x2="721" y2="365" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow-teal)"/>
</svg>
